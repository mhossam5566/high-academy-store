name: Deploy Laravel to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-academy-store-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application files
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: "-avzr --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='storage/' --exclude='old/' --exclude='crm/' --exclude='myteacher/' --exclude='vendor/' --exclude='public/images/admin/' --exclude='public/storage/'"
          path: ./
          remote_path: /home/u114442604/domains/highacademystore.com/public_html/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Install dependencies and refresh Laravel
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd /home/u114442604/domains/highacademystore.com/public_html
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan optimize:clear
            php artisan migrate --force
